name: Godot 4 Project Validation

on:
  push:
    branches: [godot-3d-upgrade]
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Validate project import and GDScript
        run: godot --headless --editor --path godot --quit
      - name: Run project in headless mode
        run: timeout 20s godot --headless --path godot --quit-after 5
