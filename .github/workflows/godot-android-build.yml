name: Godot Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [godot-3d-engine-upgrade]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/godot-android-build.yml'

permissions:
  contents: read

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3.stable"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot "$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/$GODOT_VERSION/"
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Configure Godot Android export settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Prepare Godot cache directories
        run: |
          mkdir -p .godot/imported .godot/editor build
          chmod -R u+rwX .godot build

      - name: Import project
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug "Android" build/NeonVelocity-debug.apk
          test -s build/NeonVelocity-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-velocity-android-debug
          path: build/NeonVelocity-debug.apk
          if-no-files-found: error
          retention-days: 14
