name: Godot 4 project validation

on:
  push:
    branches: [godot-3d-engine-upgrade]
  pull_request:
    branches: [main]
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/godot-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Verify supplied binary assets
        shell: bash
        run: |
          test "$(find assets/cars -maxdepth 1 -type f -name '*.glb' | wc -l)" -eq 4
          test "$(find assets/textures -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 16

      - name: Import project and validate GDScript
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Run headless startup smoke test
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --quit-after 5
