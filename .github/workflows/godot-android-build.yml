name: Godot Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [godot-3d-engine-upgrade]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/godot-android-build.yml'

permissions:
  contents: read

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3.stable"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot "$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/$GODOT_VERSION/"
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64

      - name: Import project
        run: /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/NeonVelocity-debug.apk
          test -s build/NeonVelocity-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-velocity-android-debug
          path: build/NeonVelocity-debug.apk
          if-no-files-found: error
          retention-days: 14
