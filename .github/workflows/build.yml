name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name neon_velocity
      - name: Enforce landscape orientation in Android manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(path)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          activities = root.findall(".//activity")
          main = next((a for a in activities if a.get(android + "name", "").endswith("MainActivity")), None)
          if main is None:
              raise SystemExit("MainActivity not found in generated AndroidManifest.xml")
          main.set(android + "screenOrientation", "landscape")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Android MainActivity locked to landscape.")
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neon-velocity-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
